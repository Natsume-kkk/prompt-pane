<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Prompt Pane 70/30 terminal workspace</title>
  <desc id="desc">A faithful schematic of the real Zellij workspace: Codex runs in the focused left pane and Prompt Pane lists prompts with a status bar in the right pane.</desc>
  <defs>
    <clipPath id="leftPane"><rect x="5" y="5" width="888" height="710"/></clipPath>
    <clipPath id="rightPane"><rect x="895" y="5" width="380" height="710"/></clipPath>
  </defs>

  <rect width="1280" height="720" fill="#1e1e2e"/>

  <!-- Zellij panes: 70% Codex, 30% Prompt Pane. -->
  <rect x="4" y="4" width="890" height="712" fill="none" stroke="#a6e22e" stroke-width="2"/>
  <rect x="894" y="4" width="382" height="712" fill="none" stroke="#7f849c" stroke-width="2"/>
  <rect x="15" y="0" width="139" height="18" fill="#1e1e2e"/>
  <text x="20" y="14" fill="#a6e22e" font-family="Cascadia Mono, Consolas, 'Microsoft YaHei UI', monospace" font-size="14" font-weight="700">┌ prompt-pane ─</text>
  <rect x="758" y="0" width="127" height="18" fill="#1e1e2e"/>
  <text x="763" y="14" fill="#a6e22e" font-family="Cascadia Mono, Consolas, monospace" font-size="13" font-weight="700">SCROLL:  0/240</text>

  <g clip-path="url(#leftPane)" font-family="Cascadia Mono, Consolas, 'Microsoft YaHei UI', monospace">
    <text x="15" y="37" fill="#cdd6f4" font-size="15">通过。</text>

    <text x="15" y="78" fill="#cdd6f4" font-size="15">✓ 已读取 README、产品规格与安装脚本</text>
    <text x="15" y="107" fill="#a6adc8" font-size="15">• 检查 Windows x64 安装入口与错误提示</text>
    <text x="15" y="136" fill="#a6adc8" font-size="15">• 核对 Codex Hook、Zellij 和用户目录边界</text>

    <text x="15" y="181" fill="#a6adc8" font-size="15">• Ran</text>
    <text x="67" y="181" fill="#f38ba8" font-size="15">go test ./...</text>
    <text x="15" y="210" fill="#a6adc8" font-size="15">  └ ok  github.com/Natsume-kkk/prompt-pane/internal/...</text>

    <text x="15" y="255" fill="#a6adc8" font-size="15">• Ran</text>
    <text x="67" y="255" fill="#f38ba8" font-size="15">.\scripts\build.cmd</text>
    <text x="15" y="284" fill="#a6adc8" font-size="15">  └ Built dist\prompt-pane.exe</text>

    <line x1="7" y1="326" x2="887" y2="326" stroke="#7f849c" stroke-width="1"/>

    <text x="15" y="369" fill="#cdd6f4" font-size="15">安装链路检查完成，可以使用。</text>
    <text x="15" y="401" fill="#cdd6f4" font-size="15">脚本会校验 SHA-256，并在失败时指出下载、权限或</text>
    <text x="15" y="430" fill="#cdd6f4" font-size="15">Zellij 环节，不会修改 PowerShell Profile 或系统 PATH。</text>

    <text x="15" y="478" fill="#7f849c" font-size="14">— Worked for 1m 24s —</text>
    <line x1="7" y1="500" x2="887" y2="500" stroke="#7f849c" stroke-width="1"/>

    <text x="15" y="548" fill="#cdd6f4" font-size="15">› 再检查一下窄窗口下的提示词换行</text>

    <text x="15" y="596" fill="#cdd6f4" font-size="15">• 我会检查固定尺寸渲染与 Unicode 换行边界。</text>
    <text x="15" y="632" fill="#89b4fa" font-size="15">• Running UI checks…</text>

    <line x1="7" y1="665" x2="887" y2="665" stroke="#7f849c" stroke-width="1"/>
    <text x="15" y="695" fill="#cdd6f4" font-size="16">› </text>
    <rect x="35" y="681" width="8" height="18" fill="#cdd6f4"/>
    <text x="15" y="711" fill="#a6e22e" font-size="13">prompt-pane</text>
    <text x="122" y="711" fill="#7f849c" font-size="13">·</text>
    <text x="142" y="711" fill="#f9e2af" font-size="13">weekly 68% left</text>
    <text x="283" y="711" fill="#7f849c" font-size="13">·</text>
    <text x="303" y="711" fill="#f9e2af" font-size="13">Context 91% left</text>
    <text x="460" y="711" fill="#7f849c" font-size="13">·</text>
    <text x="480" y="711" fill="#89b4fa" font-size="13">gpt-5.6-sol medium</text>
  </g>

  <g clip-path="url(#rightPane)" font-family="Cascadia Mono, Consolas, 'Microsoft YaHei UI', monospace">
    <text x="908" y="37" fill="#7f849c" font-size="15">1</text>
    <text x="936" y="37" fill="#cdd6f4" font-size="15">检查项目文档</text>

    <text x="908" y="77" fill="#7f849c" font-size="15">2</text>
    <text x="936" y="77" fill="#cdd6f4" font-size="15">确认安装脚本支持范围</text>

    <text x="908" y="117" fill="#7f849c" font-size="15">3</text>
    <text x="936" y="117" fill="#cdd6f4" font-size="15">检查下载失败时的提示</text>

    <text x="908" y="157" fill="#7f849c" font-size="15">4</text>
    <text x="936" y="157" fill="#cdd6f4" font-size="15">运行 Windows 构建检查</text>

    <text x="908" y="197" fill="#7f849c" font-size="15">5</text>
    <text x="936" y="197" fill="#cdd6f4" font-size="15">核对 SHA-256</text>

    <text x="908" y="237" fill="#7f849c" font-size="15">6</text>
    <text x="936" y="237" fill="#cdd6f4" font-size="15">确认 Hook 信任步骤</text>

    <text x="908" y="277" fill="#7f849c" font-size="15">7</text>
    <text x="936" y="277" fill="#cdd6f4" font-size="15">检查窄窗口提示词换行</text>

    <text x="908" y="317" fill="#7f849c" font-size="15">8</text>
    <text x="936" y="317" fill="#cdd6f4" font-size="15">再运行一次完整测试</text>

    <line x1="895" y1="655" x2="1275" y2="655" stroke="#7f849c" stroke-width="1"/>
    <text x="908" y="679" fill="#a6e3a1" font-size="14" font-weight="700">[LIVE]</text>
    <text x="970" y="679" fill="#f38ba8" font-size="14">(main)</text>
    <text x="1027" y="679" fill="#7f849c" font-size="14">|</text>
    <text x="1045" y="679" fill="#f9e2af" font-size="14">Total: 42.8k</text>
    <text x="1155" y="679" fill="#89b4fa" font-size="14">h help · t theme</text>

    <text x="908" y="704" fill="#cdd6f4" font-size="13">Limit: 5h:</text>
    <rect x="994" y="691" width="58" height="16" fill="#f38ba8"/>
    <rect x="1052" y="691" width="21" height="16" fill="#45475a"/>
    <text x="1081" y="704" fill="#f38ba8" font-size="13">74%</text>
    <text x="1117" y="704" fill="#7f849c" font-size="13">| Ctx:</text>
    <rect x="1174" y="691" width="52" height="16" fill="#a6e3a1"/>
    <rect x="1226" y="691" width="19" height="16" fill="#45475a"/>
    <text x="1251" y="704" fill="#a6e3a1" font-size="13">73%</text>
  </g>
</svg>
